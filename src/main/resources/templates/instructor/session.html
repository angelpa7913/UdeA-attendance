<!DOCTYPE html>
<!--
Propósito: pantalla que el instructor proyecta: QR grande, cuenta regresiva y contador de asistentes.
  Modelo esperado: sessionId, course (CourseSummary), windowSeconds.
  Pasos:
    1. <img id="qr"> apuntando a /instructor/sessions/{id}/qr.png.
    2. Pasar datos al JS con atributos data-* (data-qr-url, data-count-url, data-window-seconds),
       no con variables globales.
    3. Elemento para la cuenta regresiva y otro para el contador.
    4. Formulario POST /instructor/sessions/{id}/close → "Cerrar sesión".
    5. Cargar /js/qr-rotator.js con th:src.
  SECURITY: la página no contiene el secreto; solo la imagen del token ya firmado.
  Depende de: SessionController, AttendanceController (contador), qr-rotator.js.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${institutionName} + ' · Proyección'">Proyección</title>
</head>
<body>
    <main id="projection"
          th:data-qr-url="@{/instructor/sessions/{id}/qr.png(id=${sessionId})}"
          th:data-token-info-url="@{/instructor/sessions/{id}/token-info(id=${sessionId})}"
          th:data-count-url="@{/instructor/sessions/{id}/count(id=${sessionId})}"
          th:data-window-seconds="${windowSeconds}">
        <h1>Sesión <span th:text="${sessionId}">1</span></h1>
        <img id="qr" th:src="@{/instructor/sessions/{id}/qr.png(id=${sessionId})}" alt="Código QR de asistencia">
        <p>El código cambia en <strong id="countdown" th:text="${windowSeconds}">0</strong> s</p>
        <p>Asistentes: <strong id="count">0</strong></p>
        <form th:action="@{/instructor/sessions/{id}/close(id=${sessionId})}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>
    </main>
    <script th:src="@{/js/qr-rotator.js}" defer></script>
</body>
</html>
